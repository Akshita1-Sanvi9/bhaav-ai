<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bhaav-AI | Real-Time Bargaining Co-Pilot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .pulse-animation { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.7; transform: scale(0.95); } }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <main class="w-full max-w-md mx-auto space-y-6">
        
        <header class="text-center">
            <h1 class="text-4xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-orange-500">Bhaav-AI</h1>
            <p class="text-sm text-slate-400 mt-2">Your Real-Time Indian Street Micro-Negotiator</p>
        </header>

        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl shadow-slate-950/50">
            <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-6 text-center">Input Vendor Quote</h2>
            
            <div class="flex justify-center mb-4">
                <button id="recordBtn" onclick="toggleRecording()" class="w-24 h-24 rounded-full bg-slate-800 hover:bg-slate-700 border-2 border-slate-700 text-white flex items-center justify-center text-3xl shadow-lg transition-all duration-300 active:scale-90 focus:outline-none">
                    <i class="fas fa-microphone" id="micIcon"></i>
                </button>
            </div>
            <p id="statusText" class="text-center text-xs text-slate-500 mb-6 h-4">Click to Record</p>

            <div class="flex items-center my-4">
                <div class="flex-grow border-t border-slate-800"></div>
                <span class="px-3 text-[10px] text-slate-500 uppercase tracking-widest">OR TYPE</span>
                <div class="flex-grow border-t border-slate-800"></div>
            </div>

            <!-- FIXED MOBILE ALIGNMENT HERE -->
            <div class="flex gap-2 mt-2 w-full">
                <input type="text" id="textInput" placeholder="e.g. Aloo 50 rupaye kilo hai" class="flex-1 min-w-0 bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/50 focus:border-amber-500 text-slate-200 transition">
                <button onclick="sendText()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 px-4 sm:px-6 py-3 rounded-lg font-bold text-sm whitespace-nowrap transition-colors flex-shrink-0">Negotiate</button>
            </div>
        </div>

        <div id="outputCard" class="hidden bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl shadow-slate-950/50 space-y-4">
            
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <div>
                    <span class="text-[10px] text-slate-500 uppercase tracking-wider block">Detected Item</span>
                    <span id="detectedItem" class="text-base font-bold text-slate-100">-</span>
                </div>
                <span id="statusBadge" class="px-3 py-1 text-xs font-bold rounded-full">-</span>
            </div>

            <div class="grid grid-cols-3 gap-2 text-center">
                <div class="bg-slate-950/70 p-3 rounded-lg border border-slate-800">
                    <p class="text-[10px] text-slate-500 uppercase">Quoted</p>
                    <p id="quotedPrice" class="text-base font-bold text-red-400 mt-1">-</p>
                </div>
                <div class="bg-slate-950/70 p-3 rounded-lg border border-slate-800">
                    <p class="text-[10px] text-slate-500 uppercase">Fair Rate</p>
                    <p id="fairPrice" class="text-base font-bold text-emerald-400 mt-1">-</p>
                </div>
                <div class="bg-slate-950/70 p-3 rounded-lg border border-slate-800">
                    <p class="text-[10px] text-slate-500 uppercase">Counter</p>
                    <p id="counterOffer" class="text-base font-bold text-amber-400 mt-1">-</p>
                </div>
            </div>

            <!-- In-Ear Whisper with Speaker Button -->
            <div class="bg-slate-950/50 border border-slate-800 rounded-lg p-3 flex items-start justify-between">
                <div class="flex items-start space-x-3 pr-2">
                    <i class="fas fa-headset text-amber-400 mt-0.5"></i>
                    <div>
                        <p class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider">In-Ear Whisper</p>
                        <p id="whisperAdvice" class="text-xs text-slate-300 mt-0.5 leading-relaxed">...</p>
                    </div>
                </div>
                <button id="playWhisperBtn" class="hidden text-slate-400 hover:text-amber-400 transition-colors bg-slate-800 p-2 rounded-full h-8 w-8 flex items-center justify-center flex-shrink-0">
                    <i class="fas fa-volume-up text-sm"></i>
                </button>
            </div>

            <div class="bg-amber-950/20 border border-amber-900/40 rounded-lg p-4">
                <p class="text-[10px] font-semibold text-amber-400 uppercase tracking-wider mb-1"><i class="fas fa-comment-dots mr-1"></i> Speak Back Script</p>
                <p id="speechScript" class="text-sm font-medium text-amber-100 italic mb-3">"..."</p>
                
                <div class="flex gap-2">
                    <button id="playAudioBtn" class="hidden flex-1 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2 rounded-lg text-sm transition-colors flex items-center justify-center gap-2">
                        <i class="fas fa-volume-up"></i> Speak
                    </button>
                    
                    <button id="negotiateAgainBtn" onclick="negotiateAgain()" class="hidden flex-1 bg-slate-700 hover:bg-slate-600 text-white font-bold py-2 rounded-lg text-sm transition-colors flex items-center justify-center gap-2">
                        <i class="fas fa-handshake"></i> Compromise
                    </button>
                </div>
            </div>
        </div>

        <div id="errorArea" class="hidden p-3 rounded-lg bg-red-950/50 border border-red-800/50 text-red-300 text-xs">
            <p id="errorMessage"></p>
        </div>

    </main>

    <script>
        let mediaRecorder, audioChunks = [], isRecording = false;
        let currentAudio = null, negotiationRound = 1, currentInputType = null, currentInputData = null;

        async function toggleRecording() {
            const btn = document.getElementById('recordBtn'), icon = document.getElementById('micIcon'), status = document.getElementById('statusText');
            document.getElementById('errorArea').classList.add('hidden');

            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = sendAudio;
                    mediaRecorder.start();
                    isRecording = true;
                    btn.classList.add('bg-red-600', 'pulse-animation');
                    btn.classList.remove('bg-slate-800');
                    icon.className = 'fas fa-stop';
                    status.innerText = 'Recording... Click to Stop';
                } catch (err) {
                    document.getElementById('errorMessage').innerText = 'Microphone access denied.';
                    document.getElementById('errorArea').classList.remove('hidden');
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                btn.classList.remove('bg-red-600', 'pulse-animation');
                btn.classList.add('bg-slate-800');
                icon.className = 'fas fa-spinner animate-spin';
                status.innerText = 'Processing...';
            }
        }

        async function sendAudio() {
            // Detect the actual format the browser recorded in (webm or mp4)
            const mimeType = mediaRecorder.mimeType || 'audio/webm';
            const extension = mimeType.includes('mp4') ? 'mp4' : 'webm';
            const audioBlob = new Blob(audioChunks, { type: mimeType });
            
            currentInputType = 'audio'; 
            currentInputData = audioBlob; 
            negotiationRound = 1;
            
            const formData = new FormData();
            formData.append('file', audioBlob, `audio.${extension}`); 
            formData.append('round_number', negotiationRound);
            submitNegotiation(formData);
        }

        function sendText() {
            const text = document.getElementById('textInput').value;
            if (!text.trim()) return;
            currentInputType = 'text'; currentInputData = text; negotiationRound = 1;
            const formData = new FormData();
            formData.append('text_input', text); formData.append('round_number', negotiationRound);
            submitNegotiation(formData);
        }

        function negotiateAgain() {
            if (!currentInputType || !currentInputData) return;
            negotiationRound++;
            const formData = new FormData();
            if (currentInputType === 'text') formData.append('text_input', currentInputData);
            else formData.append('file', currentInputData);
            formData.append('round_number', negotiationRound);
            submitNegotiation(formData);
        }

        async function submitNegotiation(formData) {
            document.getElementById('statusText').innerText = 'Negotiating...';
            document.getElementById('errorArea').classList.add('hidden');
            document.getElementById('playAudioBtn').classList.add('hidden');
            document.getElementById('playWhisperBtn').classList.add('hidden');
            document.getElementById('negotiateAgainBtn').classList.add('hidden');

            if (currentAudio) { currentAudio.pause(); currentAudio = null; }

            try {
                const res = await fetch('/api/negotiate', { method: 'POST', body: formData });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'Server error');

                document.getElementById('outputCard').classList.remove('hidden');
                document.getElementById('detectedItem').innerText = data.item + (negotiationRound > 1 ? ` (Round ${negotiationRound})` : "");
                document.getElementById('quotedPrice').innerText = '₹' + data.quoted_price;
                document.getElementById('fairPrice').innerText = '₹' + data.fair_price;
                document.getElementById('counterOffer').innerText = '₹' + data.counter_offer;
                document.getElementById('whisperAdvice').innerText = data.whisper_advice;
                document.getElementById('speechScript').innerText = '"' + data.speech_script + '"';
                
                const badge = document.getElementById('statusBadge');
                if (data.status === "FAIR PRICE") {
                    badge.className = 'px-3 py-1 text-xs font-bold rounded-full bg-emerald-950 text-emerald-400 border border-emerald-800';
                    badge.innerText = 'FAIR PRICE';
                } else {
                    badge.className = 'px-3 py-1 text-xs font-bold rounded-full bg-red-950 text-red-400 border border-red-800';
                    badge.innerText = `OVERCHARGED +${data.overcharge_pct}%`;
                }

                if (data.tts_available) {
                    const playBtn = document.getElementById('playAudioBtn');
                    playBtn.classList.remove('hidden');
                    playBtn.onclick = () => {
                        currentAudio = new Audio('/audio/counter?t=' + Date.now());
                        currentAudio.play();
                    };
                }

                if (data.whisper_tts_available) {
                    const whisperBtn = document.getElementById('playWhisperBtn');
                    whisperBtn.classList.remove('hidden');
                    whisperBtn.onclick = () => {
                        currentAudio = new Audio('/audio/whisper?t=' + Date.now());
                        currentAudio.play();
                    };
                }

                if (data.status !== "FAIR PRICE" && data.overcharge_pct > 0) {
                    document.getElementById('negotiateAgainBtn').classList.remove('hidden');
                }

            } catch (err) {
                document.getElementById('errorMessage').innerText = `Error: ${err.message}`;
                document.getElementById('errorArea').classList.remove('hidden');
            } finally {
                document.getElementById('statusText').innerText = 'Click to Record';
                document.getElementById('micIcon').className = 'fas fa-microphone';
            }
        }
    </script>
</body>
</html>
